# Compila y prueba ManteniTrack en cada push a main.
#
# Resultado (pestaña Actions → la ejecución → Artifacts):
#   · mantenitrak-apk  → APK de Android para instalar en el móvil
#   · mantenitrak-web  → versión web
# Y, si activas GitHub Pages con origen "GitHub Actions", la web queda
# publicada en https://<usuario>.github.io/<repo>/
#
# Antes, en Settings → Secrets and variables → Actions, crea:
#   SUPABASE_URL, SUPABASE_ANON_KEY
name: Compilar y probar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Si el repositorio solo tiene lib/, test/ y pubspec.yaml, genera las
      # carpetas de plataforma. Nunca sobrescribe archivos existentes.
      - name: Generar plataformas si faltan
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create . --org com.tuempresa --project-name mantenitrak --platforms android,web
            rm -f test/widget_test.dart   # plantilla de Flutter que no aplica a este proyecto
          fi

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Configuración de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Faltan los secretos SUPABASE_URL / SUPABASE_ANON_KEY: la app mostrará 'Falta la configuración'."
          fi
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $key}' > env.json

      - name: APK de Android (debug)
        run: flutter build apk --debug --dart-define-from-file=env.json

      - name: Web
        run: flutter build web --release --dart-define-from-file=env.json --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: mantenitrak-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mantenitrak-web
          path: build/web

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

  # Publica la web en GitHub Pages (opcional: actívalo en Settings → Pages).
  deploy-web:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
